# 本地开发依赖：Elasticsearch + Redis + Python 双塔推理服务
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 注：compose 里的 model 服务是 CPU 版 torch；本机直跑 model/server.py 可用 RTX 5060 GPU
name: mini-recommender

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false" # 本地开发关闭安全特性，省去 TLS/账号配置
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Python 双塔推理服务（物品塔编码 + 查询塔编码），Go API 通过 MODEL_URL 访问
  model:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.model
    environment:
      MODEL_DIR: /model/artifacts/v1
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../model/artifacts:/model/artifacts # 训练产物直接挂载进来，重建模型无需重新打镜像
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  es-data:
